<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discord</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 40px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .widget {
            margin-bottom: 25px;
        }

        .widget iframe {
            max-width: 100%;
        }

        .join-button {
            display: inline-block;
            padding: 14px 32px;
            background: white;
            color: black;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
        }

        .join-button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Rejoindre le serveur</h1>

        <div class="widget">

            <<iframe src="https://ptb.discord.com/widget?id=1546928938167828583&theme=dark" width="350" height="500" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>>

        </div>

        <a class="join-button"
           href="https://discord.gg/8b3h6sWGps"
           target="_blank"
           rel="noopener noreferrer">
            Rejoindre le serveur
        </a>

    </div>

</body>
</html>
